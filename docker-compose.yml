services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_medtower
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: MitMedT0wer2026$
    volumes:
      - crm_medtower_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_medtower -d crm_medtower"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_net

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - /root/traefik/certs:/app/certs:ro
    ports:
      - "0.0.0.0:8444:8444"
    networks:
      - crm_net

volumes:
  crm_medtower_pgdata:

networks:
  crm_net:
    driver: bridge
